name: Build Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "SarvamVoiceAssistant/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "SarvamVoiceAssistant/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SarvamVoiceAssistant

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('SarvamVoiceAssistant/**/*.gradle.kts', 'SarvamVoiceAssistant/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: SarvamVoiceAssistant/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sarvam-voice-debug-apk
          path: SarvamVoiceAssistant/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
